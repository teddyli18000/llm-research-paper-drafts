name: Research 01 — group-gradient preconditioner versus shared parameters
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/research-01-gradient-kernel.yml"
      - "research-lab/01-rare-words-shared-output-vectors/gradient_kernel_study.py"
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU dependencies
        run: |
          python -m pip install numpy huggingface_hub
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Prepare data and isolated runner
        run: |
          python research-lab/01-rare-words-shared-output-vectors/prepare_data.py
          python research-lab/01-rare-words-shared-output-vectors/build_runner.py
      - name: Run head-only gradient kernel versus learnable shared cluster vectors
        run: |
          set -euo pipefail
          python -u research-lab/01-rare-words-shared-output-vectors/gradient_kernel_study.py | tee gradient_kernel.log
      - name: Archive all runs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rare-01-gradient-kernel
          path: |
            gradient_kernel.log
            research-lab/01-rare-words-shared-output-vectors/gradient_kernel_study.jsonl
          if-no-files-found: ignore
