name: Research 01 — content versus arbitrary reparameterization
on:
  workflow_dispatch:
  push:
    paths:
      - "research-lab/01-rare-words-shared-output-vectors/cluster_controls.py"
      - ".github/workflows/research-01-content-cluster-controls.yml"
permissions:
  contents: read
jobs:
  mechanism:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU dependencies
        run: |
          python -m pip install numpy huggingface_hub
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Build data and isolated instrumented runner
        run: |
          python research-lab/01-rare-words-shared-output-vectors/prepare_data.py
          python research-lab/01-rare-words-shared-output-vectors/build_runner.py
      - name: Run random refresh, same membership recentering, and warmstart clustering
        run: |
          python -u research-lab/01-rare-words-shared-output-vectors/cluster_controls.py | tee cluster_controls.log
      - name: Upload result matrix
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rare-01-cluster-content-controls
          path: |
            research-lab/01-rare-words-shared-output-vectors/cluster_controls.jsonl
            cluster_controls.log
          if-no-files-found: ignore
