name: Research 01 — rare-target-selective group gradient sharing
on:
  workflow_dispatch:
  push:
    paths:
      - "research-lab/01-rare-words-shared-output-vectors/rare_selective_gradient.py"
      - ".github/workflows/research-01-rare-target-gradient.yml"
permissions:
  contents: read
jobs:
  selective:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU dependencies
        run: |
          python -m pip install numpy huggingface_hub
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Prepare dataset and original instrumented model
        run: |
          python research-lab/01-rare-words-shared-output-vectors/prepare_data.py
          python research-lab/01-rare-words-shared-output-vectors/build_runner.py
      - name: Compare training-frequency-gated group gradient transfer (3 seeds)
        run: |
          set -euo pipefail
          python -u research-lab/01-rare-words-shared-output-vectors/rare_selective_gradient.py | tee rare_selective.log
      - name: Archive results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: research01-rare-selective
          path: |
            rare_selective.log
            research-lab/01-rare-words-shared-output-vectors/rare_selective.jsonl
          if-no-files-found: ignore
