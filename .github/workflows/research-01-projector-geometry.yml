name: Research 01 — causal group-geometry projector ablation
on:
  push:
    paths:
      - ".github/workflows/research-01-projector-geometry.yml"
      - "research-lab/01-rare-words-shared-output-vectors/projector_geometry_ablation.py"
      - "research-review/01-rare-words-shared-output-vectors/PROJECTOR_CAUSAL_ABLATION_PROTOCOL.md"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  projector_geometry:
    runs-on: ubuntu-24.04
    timeout-minutes: 85
    strategy:
      fail-fast: false
      matrix:
        seed: [223, 227, 229]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU, contextual groups and official Ember
        run: |
          python -m pip install numpy huggingface_hub scipy scikit-learn
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install "git+https://github.com/katop1234/ember.git@76f30117b2d948874cd1c965c4f6813fa9de8caa"
      - name: Prepare original model, data and train-only contextual groups
        run: |
          python research-lab/01-rare-words-shared-output-vectors/prepare_data.py
          python research-lab/01-rare-words-shared-output-vectors/context_groups.py
          python research-lab/01-rare-words-shared-output-vectors/build_runner.py
      - name: Matched nine-arm causal group-geometry comparison
        run: |
          python -u research-lab/01-rare-words-shared-output-vectors/projector_geometry_ablation.py --seed ${{ matrix.seed }} | tee projector_geometry.log
      - name: Assert nine completed finite trials
        run: |
          python - <<'PY'
          import json,math
          from pathlib import Path
          paths=list(Path("research-lab/01-rare-words-shared-output-vectors").glob("projector_geometry_seed*.jsonl"))
          assert len(paths)==1
          rows=[json.loads(x) for x in paths[0].read_text().splitlines()]
          assert len(rows)==9 and len(set(r["tag"] for r in rows))==9
          assert all(math.isfinite(r["scores"]["val"]) for r in rows)
          PY
      - name: Archive full results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: projector-geometry-seed${{ matrix.seed }}
          path: |
            projector_geometry.log
            research-lab/01-rare-words-shared-output-vectors/projector_geometry_seed*.jsonl
          if-no-files-found: ignore
