name: Research 01 — measured class-gradient coherence over training
on:
  push:
    paths:
      - ".github/workflows/research-01-gradient-coherence.yml"
      - "research-lab/01-rare-words-shared-output-vectors/projector_coherence_probe.py"
      - "research-review/01-rare-words-shared-output-vectors/PROJECTOR_GRADIENT_COHERENCE_PROTOCOL.md"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gradient_coherence:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        seed: [223, 227, 229]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install scientific CPU and pinned Ember
        run: |
          python -m pip install numpy huggingface_hub scipy scikit-learn
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install "git+https://github.com/katop1234/ember.git@76f30117b2d948874cd1c965c4f6813fa9de8caa"
      - name: Prepare original data and contextual group partition
        run: |
          python research-lab/01-rare-words-shared-output-vectors/prepare_data.py
          python research-lab/01-rare-words-shared-output-vectors/context_groups.py
          python research-lab/01-rare-words-shared-output-vectors/build_runner.py
      - name: Trace pre-optimizer group-gradient energy at six fixed steps
        run: |
          python -u research-lab/01-rare-words-shared-output-vectors/projector_coherence_probe.py --seed ${{ matrix.seed }} | tee coherence.log
      - name: Archive coherence traces and losses
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: projector-coherence-seed${{ matrix.seed }}
          path: |
            coherence.log
            research-lab/01-rare-words-shared-output-vectors/projector_coherence_seed*.jsonl
          if-no-files-found: ignore
