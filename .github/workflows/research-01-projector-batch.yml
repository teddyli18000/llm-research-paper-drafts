name: Research 01 — equal-token projected Ember batch stress
on:
  push:
    paths:
      - ".github/workflows/research-01-projector-batch.yml"
      - "research-lab/01-rare-words-shared-output-vectors/projector_batch_study.py"
      - "research-review/01-rare-words-shared-output-vectors/PROJECTOR_BATCH_SCALING_PROTOCOL.md"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  batch_stress:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    strategy:
      fail-fast: false
      matrix:
        batch: [32, 128]
        seed: [269, 271, 277]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU dependencies and official Ember
        run: |
          python -m pip install numpy huggingface_hub
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install "git+https://github.com/katop1234/ember.git@76f30117b2d948874cd1c965c4f6813fa9de8caa"
      - name: Prepare original training run
        run: |
          python research-lab/01-rare-words-shared-output-vectors/prepare_data.py
          python research-lab/01-rare-words-shared-output-vectors/build_runner.py
      - name: Train three methods at the same 819200-token budget
        run: |
          python -u research-lab/01-rare-words-shared-output-vectors/projector_batch_study.py --seed ${{ matrix.seed }} --batch ${{ matrix.batch }} | tee batch.log
      - name: Verify completed finite results
        run: |
          python - <<'PY'
          import json,math
          from pathlib import Path
          paths=list(Path("research-lab/01-rare-words-shared-output-vectors").glob("projector_batch*_seed*.jsonl"))
          assert len(paths)==1
          rows=[json.loads(s) for s in paths[0].read_text().splitlines()]
          assert len(rows)==3 and len(set(r["tag"] for r in rows))==3
          assert all(math.isfinite(r["scores"]["val"]) for r in rows)
          assert all(r["tokens"]==819200 for r in rows)
          PY
      - name: Archive output and target-frequency metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: projector-batch${{ matrix.batch }}-seed${{ matrix.seed }}
          path: |
            batch.log
            research-lab/01-rare-words-shared-output-vectors/projector_batch*_seed*.jsonl
          if-no-files-found: ignore
