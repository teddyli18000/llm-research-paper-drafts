name: Research 01 — decoupled second-moment routing
on:
  push:
    branches:
      - "research/01-modern-optimizer-baselines"
    paths:
      - ".github/workflows/research-01-moment-routing.yml"
      - "research-lab/01-rare-words-shared-output-vectors/moment_routing_trial.py"
      - "research-lab/01-rare-words-shared-output-vectors/moment_routing_test.py"
      - "research-review/01-rare-words-shared-output-vectors/MOMENT_ROUTING_PROTOCOL.md"
permissions:
  contents: read
jobs:
  moment_routing:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        seed: [521, 523, 541]
        batch: [32, 128]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU scientific dependencies and pinned Ember
        run: |
          python -m pip install numpy huggingface_hub scipy scikit-learn
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install "git+https://github.com/katop1234/ember.git@76f30117b2d948874cd1c965c4f6813fa9de8caa"
      - name: Verify decoupled second-moment identities
        run: python research-lab/01-rare-words-shared-output-vectors/moment_routing_test.py
      - name: Prepare original model, train-only classes and runtime
        run: |
          python research-lab/01-rare-words-shared-output-vectors/prepare_data.py
          python research-lab/01-rare-words-shared-output-vectors/context_groups.py
          python research-lab/01-rare-words-shared-output-vectors/build_runner.py
      - name: Run all eight matched arms
        run: |
          python -u research-lab/01-rare-words-shared-output-vectors/moment_routing_trial.py --seed ${{ matrix.seed }} --batch ${{ matrix.batch }} | tee moment_routing.log
      - name: Verify all arms and frequency buckets
        run: |
          python - <<'PY'
          import json, math
          from pathlib import Path
          ps = list(Path("research-lab/01-rare-words-shared-output-vectors").glob("moment_routing_b*_s*.jsonl"))
          assert len(ps) == 1
          rows = [json.loads(s) for s in ps[0].read_text().splitlines()]
          assert len(rows) == 8 and len({r["tag"] for r in rows}) == 8
          assert all(math.isfinite(r["scores"]["val"]) and r["tokens"] == 819200 for r in rows)
          for mode in ("dynamic", "context", "context_late"):
              shared = next(r for r in rows if r["args"]["proj_mode"] == mode and r["args"]["moment_route"] == "shared")
              raw = next(r for r in rows if r["args"]["proj_mode"] == mode and r["args"]["moment_route"] == "raw_stats")
              assert shared["projected_to_raw_norm_mean"] is not None
              assert raw["projected_to_raw_norm_mean"] is not None
              assert raw["head_update_norm_mean"] > 0 and shared["head_update_norm_mean"] > 0
              assert set(shared["bins"]) == set(raw["bins"])
          PY
      - name: Archive scores, frequency buckets and moment-routing traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: moment-routing-b${{ matrix.batch }}-seed-${{ matrix.seed }}
          path: |
            moment_routing.log
            research-lab/01-rare-words-shared-output-vectors/moment_routing_b*_s*.jsonl
          if-no-files-found: ignore
