name: Research 01 — pretrained semantic static grouping
on:
  workflow_dispatch:
  push:
    paths:
      - "research-lab/01-rare-words-shared-output-vectors/pretrained_semantic_groups.py"
      - "research-lab/01-rare-words-shared-output-vectors/fixed_semantic_study.py"
      - ".github/workflows/research-01-semantic-static.yml"
permissions:
  contents: read
jobs:
  pretrained:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install numpy, HF, sklearn, safetensors, PyTorch
        run: |
          python -m pip install numpy huggingface_hub safetensors scikit-learn
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Reconstruct public GPT2-token FineWeb data
        run: python research-lab/01-rare-words-shared-output-vectors/prepare_data.py
      - name: Cluster pretrained GPT-2 output-head vectors into 64 frozen groups
        run: python research-lab/01-rare-words-shared-output-vectors/pretrained_semantic_groups.py
      - name: Reconstruct original model with seed support
        run: python research-lab/01-rare-words-shared-output-vectors/build_runner.py
      - name: Train fixed pretrained semantic grouping for three seeds
        run: python -u research-lab/01-rare-words-shared-output-vectors/fixed_semantic_study.py | tee pretrained_semantic.log
      - name: Export grouping study artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rare-01-pretrained-semantic-groups
          path: |
            pretrained_semantic.log
            research-lab/01-rare-words-shared-output-vectors/semantic_fixed_study.jsonl
          if-no-files-found: ignore
