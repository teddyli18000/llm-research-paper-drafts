name: Research 01 — train-gradient coherence gated class projection
on:
  push:
    paths:
      - ".github/workflows/research-01-coherence-gate.yml"
      - "research-lab/01-rare-words-shared-output-vectors/coherence_gate_trial.py"
      - "research-review/01-rare-words-shared-output-vectors/COHERENCE_GATED_PROJECTOR_PROTOCOL.md"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  class_coherence_gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        seed: [431,433,439]
        batch: [32,128]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: CPU torch, semantic grouping, official Ember
        run: |
          python -m pip install numpy huggingface_hub scipy scikit-learn
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install "git+https://github.com/katop1234/ember.git@76f30117b2d948874cd1c965c4f6813fa9de8caa"
      - name: Prepare original model and train-only class partition
        run: |
          python research-lab/01-rare-words-shared-output-vectors/prepare_data.py
          python research-lab/01-rare-words-shared-output-vectors/context_groups.py
          python research-lab/01-rare-words-shared-output-vectors/build_runner.py
      - name: Compare 4 locked gradient-subspace selection rules
        run: |
          python -u research-lab/01-rare-words-shared-output-vectors/coherence_gate_trial.py --seed ${{ matrix.seed }} --batch ${{ matrix.batch }} | tee coherence_gate.log
      - name: Ensure all variants and diagnostic traces complete
        run: |
          python - <<'PY'
          import json,math
          from pathlib import Path
          ps=list(Path("research-lab/01-rare-words-shared-output-vectors").glob("coherence_gate_b*_s*.jsonl"))
          assert len(ps)==1
          rows=[json.loads(s) for s in ps[0].read_text().splitlines()]
          assert len(rows)==4 and len({r["tag"] for r in rows})==4
          assert all(math.isfinite(r["scores"]["val"]) and r["tokens"]==819200 for r in rows)
          assert 0<=rows[3]["gate_dynamic_frac"]<=1 and len(rows[3]["gate_trace"])>=4
          PY
      - name: Archive all scores, target-frequency bins and gate traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coherence-gate-b${{ matrix.batch }}-seed${{ matrix.seed }}
          path: |
            coherence_gate.log
            research-lab/01-rare-words-shared-output-vectors/coherence_gate_b*_s*.jsonl
          if-no-files-found: ignore
