name: Research 01 — class reparameterization versus direct group projection
on:
  push:
    paths:
      - ".github/workflows/research-01-tree-reparam-ember.yml"
      - "research-lab/01-rare-words-shared-output-vectors/tree_reparam_ember_trial.py"
      - "research-review/01-rare-words-shared-output-vectors/TREE_REPARAM_EMBER_COLLISION_PROTOCOL.md"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tree_reparam:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        seed: [373,379,383]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: CPU torch, context groups, and pinned Ember
        run: |
          python -m pip install numpy huggingface_hub scipy scikit-learn
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install "git+https://github.com/katop1234/ember.git@76f30117b2d948874cd1c965c4f6813fa9de8caa"
      - name: Prove algebraic SGD equivalence
        run: |
          python research-lab/01-rare-words-shared-output-vectors/tree_loss_equivalence_test.py
      - name: Prepare original FineWeb model and train-only class partition
        run: |
          python research-lab/01-rare-words-shared-output-vectors/prepare_data.py
          python research-lab/01-rare-words-shared-output-vectors/context_groups.py
          python research-lab/01-rare-words-shared-output-vectors/build_runner.py
      - name: Run five matched-forward reparam versus direct heads
        run: |
          python -u research-lab/01-rare-words-shared-output-vectors/tree_reparam_ember_trial.py --seed ${{ matrix.seed }} | tee reparam.log
      - name: Check complete output
        run: |
          python - <<'PY'
          import json,math
          from pathlib import Path
          ps=list(Path("research-lab/01-rare-words-shared-output-vectors").glob("tree_reparam_seed*.jsonl"))
          assert len(ps)==1
          rows=[json.loads(s) for s in ps[0].read_text().splitlines()]
          assert len(rows)==5 and len(set(r["tag"] for r in rows))==5
          assert all(math.isfinite(r["scores"]["val"]) for r in rows)
          PY
      - name: Archive per-condition results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tree-reparam-seed${{ matrix.seed }}
          path: |
            reparam.log
            research-lab/01-rare-words-shared-output-vectors/tree_reparam_seed*.jsonl
          if-no-files-found: ignore
