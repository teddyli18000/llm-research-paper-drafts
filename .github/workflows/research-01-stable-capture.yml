name: Research 01 — prediction and target residual decomposition
on:
  push:
    branches:
      - "research/01-modern-optimizer-baselines"
    paths:
      - ".github/workflows/research-01-stable-capture.yml"
      - "research-lab/01-rare-words-shared-output-vectors/residual_decomposition_trial.py"
      - "research-lab/01-rare-words-shared-output-vectors/residual_decomposition_test.py"
      - "research-review/01-rare-words-shared-output-vectors/RESIDUAL_DECOMPOSITION_PROTOCOL.md"
permissions:
  contents: read
jobs:
  residual_decomposition:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        seed: [547, 557, 563]
        batch: [32, 128]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU scientific dependencies and pinned Ember
        run: |
          python -m pip install numpy huggingface_hub scipy scikit-learn
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install "git+https://github.com/katop1234/ember.git@76f30117b2d948874cd1c965c4f6813fa9de8caa"
      - name: Verify exact prediction/target decomposition
        run: python research-lab/01-rare-words-shared-output-vectors/residual_decomposition_test.py
      - name: Prepare original model, train-only classes and runtime
        run: |
          python research-lab/01-rare-words-shared-output-vectors/prepare_data.py
          python research-lab/01-rare-words-shared-output-vectors/context_groups.py
          python research-lab/01-rare-words-shared-output-vectors/build_runner.py
      - name: Run all eight matched arms
        run: |
          python -u research-lab/01-rare-words-shared-output-vectors/residual_decomposition_trial.py --seed ${{ matrix.seed }} --batch ${{ matrix.batch }} | tee residual_decomposition.log
      - name: Verify all arms and decomposition identities
        run: |
          python - <<'PY'
          import json, math
          from pathlib import Path
          ps = list(Path("research-lab/01-rare-words-shared-output-vectors").glob("residual_decomposition_b*_s*.jsonl"))
          assert len(ps) == 1
          rows = [json.loads(s) for s in ps[0].read_text().splitlines()]
          assert len(rows) == 8 and len({r["tag"] for r in rows}) == 8
          assert all(math.isfinite(r["scores"]["val"]) and r["tokens"] == 819200 for r in rows)
          for row in rows:
              if row["args"]["residual_mode"] != "none":
                  assert row["decomposition_error_max"] < 2e-5
                  assert row["pred_correction_norm_mean"] > 0
                  assert row["target_correction_norm_mean"] > 0
          PY
      - name: Archive scores, frequency buckets and residual traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: residual-decomposition-b${{ matrix.batch }}-seed-${{ matrix.seed }}
          path: |
            residual_decomposition.log
            research-lab/01-rare-words-shared-output-vectors/residual_decomposition_b*_s*.jsonl
          if-no-files-found: ignore
