name: Research 01 — three-seed 400-step confirmation
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/research-01-confirm.yml"
permissions:
  contents: read
jobs:
  confirmation:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU dependencies
        run: |
          python -m pip install numpy huggingface_hub
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Verify analytic identities
        run: python research-lab/01-rare-words-shared-output-vectors/theory_check.py
      - name: Prepare public GPT-2 FineWeb10B
        run: python research-lab/01-rare-words-shared-output-vectors/prepare_data.py
      - name: Build independent instrumented runner
        run: python research-lab/01-rare-words-shared-output-vectors/build_runner.py
      - name: Confirm matched 400-step experiments across seeds 0 1 2
        run: python -u research-lab/01-rare-words-shared-output-vectors/run_matrix.py --mode confirm | tee confirm.log
      - name: Check complete records, not whether hypothesis succeeded
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, math
          p = Path("research-lab/01-rare-words-shared-output-vectors/results_confirm.jsonl")
          rs = [json.loads(s) for s in p.read_text().splitlines()]
          assert len(rs) == 21
          for r in rs:
              assert math.isfinite(r["scores"]["val"])
              assert r["args"]["steps"] == 400
          PY
      - name: Save logs and full result JSONL
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rare-01-three-seed-confirmation
          path: |
            confirm.log
            research-lab/01-rare-words-shared-output-vectors/results_confirm.jsonl
          if-no-files-found: ignore
