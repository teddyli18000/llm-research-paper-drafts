name: Research 01 — pretrained semantic groups with online regrouping
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/research-01-semantic-hybrid.yml"
      - "research-lab/01-rare-words-shared-output-vectors/semantic_hybrid_study.py"
permissions:
  contents: read
jobs:
  hybrid:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install required libraries
        run: |
          python -m pip install numpy huggingface_hub scikit-learn safetensors
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Build public FineWeb dataset and pretrained semantic cluster groups
        run: |
          python research-lab/01-rare-words-shared-output-vectors/prepare_data.py
          python research-lab/01-rare-words-shared-output-vectors/pretrained_semantic_groups.py
      - name: Build isolated training replica
        run: python research-lab/01-rare-words-shared-output-vectors/build_runner.py
      - name: Train semantic-group initializations with online cluster updates
        run: |
          set -euo pipefail
          python -u research-lab/01-rare-words-shared-output-vectors/semantic_hybrid_study.py | tee semantic_hybrid.log
      - name: Save experimental records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rare-01-semantic-online-hybrid
          path: |
            semantic_hybrid.log
            research-lab/01-rare-words-shared-output-vectors/semantic_hybrid_study.jsonl
          if-no-files-found: ignore
