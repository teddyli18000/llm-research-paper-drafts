name: Research 01 — larger width 128, vocabulary 16k
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/research-01-scale-16k-128.yml"
      - "research-lab/01-rare-words-shared-output-vectors/context_groups_16000.py"
permissions:
  contents: read
jobs:
  scale:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        arm: [baseline, dynamic, context]
        seed: [0, 1]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU dependencies
        run: |
          python -m pip install numpy huggingface_hub scipy scikit-learn
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Prepare public data
        run: python research-lab/01-rare-words-shared-output-vectors/prepare_data.py
      - name: Derive same-data context clusters (context arm only)
        if: matrix.arm == 'context'
        run: python research-lab/01-rare-words-shared-output-vectors/context_groups_16000.py
      - name: Build original-model replica
        run: python research-lab/01-rare-words-shared-output-vectors/build_runner.py
      - name: Add support for static same-data context groups
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path("research-lab/01-rare-words-shared-output-vectors/grid_study_runtime.py")
          s=p.read_text()
          old='        if a.cinit == "freq": asg = freq_classes(K)'
          new='        if a.cinit == "context16": asg = np.load(os.path.join(DATA, "context_groups_16000.npy"))\n        elif a.cinit == "freq": asg = freq_classes(K)'
          s=s.replace(old,new)
          p.write_text(s)
          PY
      - name: Train seed-matched larger LM
        run: |
          set -euo pipefail
          case "${{ matrix.arm }}" in
            baseline) ARMS="--clus 0" ;;
            dynamic)  ARMS="--clus 64 --cinit kmeans" ;;
            context)  ARMS="--clus 64 --cinit context16" ;;
          esac
          python -u research-lab/01-rare-words-shared-output-vectors/grid_study_runtime.py             --dev cpu --threads 2 --V 16000 --width 128 --layers 2 --heads 4             --batch 32 --steps 400 --heps 1e-5 --hlr 0.03 --clr 0.005             --seed ${{ matrix.seed }} $ARMS             --tag "scale16k_${{ matrix.arm }}_seed${{ matrix.seed }}" --out "scale16k_${{ matrix.arm }}_seed${{ matrix.seed }}.jsonl"             | tee training.log
      - name: Save per-arm result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scale16k-${{ matrix.arm }}-seed${{ matrix.seed }}
          path: |
            research-lab/01-rare-words-shared-output-vectors/scale16k_*.jsonl
            training.log
          if-no-files-found: ignore
