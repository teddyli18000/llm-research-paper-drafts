name: Research 01 — cross-microbatch reliability-gated output projection
on:
  push:
    paths:
      - ".github/workflows/research-01-microbatch-reliability.yml"
      - "research-lab/01-rare-words-shared-output-vectors/microbatch_reliability_trial.py"
      - "research-lab/01-rare-words-shared-output-vectors/microbatch_reliability_test.py"
      - "research-review/01-rare-words-shared-output-vectors/MICROBATCH_RELIABILITY_PROTOCOL.md"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  microbatch_reliability:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        seed: [443, 449, 457]
        batch: [32, 128]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU scientific dependencies and pinned Ember
        run: |
          python -m pip install numpy huggingface_hub scipy scikit-learn
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install "git+https://github.com/katop1234/ember.git@76f30117b2d948874cd1c965c4f6813fa9de8caa"
      - name: Verify cross-microbatch reliability identity
        run: python research-lab/01-rare-words-shared-output-vectors/microbatch_reliability_test.py
      - name: Prepare original model, train-only classes and runtime
        run: |
          python research-lab/01-rare-words-shared-output-vectors/prepare_data.py
          python research-lab/01-rare-words-shared-output-vectors/context_groups.py
          python research-lab/01-rare-words-shared-output-vectors/build_runner.py
      - name: Run all six matched arms
        run: |
          python -u research-lab/01-rare-words-shared-output-vectors/microbatch_reliability_trial.py --seed ${{ matrix.seed }} --batch ${{ matrix.batch }} | tee microbatch_reliability.log
      - name: Verify all arms and estimator traces
        run: |
          python - <<'PY'
          import json, math
          from pathlib import Path
          ps = list(Path("research-lab/01-rare-words-shared-output-vectors").glob("microbatch_reliability_b*_s*.jsonl"))
          assert len(ps) == 1
          rows = [json.loads(s) for s in ps[0].read_text().splitlines()]
          assert len(rows) == 6 and len({r["tag"] for r in rows}) == 6
          assert all(math.isfinite(r["scores"]["val"]) and r["tokens"] == 819200 for r in rows)
          for gate in rows[4:6]:
              assert gate["rho_context_mean"] is not None and gate["rho_dynamic_mean"] is not None
              assert 0 <= gate["gate_dynamic_frac"] <= 1 and 0 <= gate["gate_alpha_mean"] <= 2
              assert len(gate["gate_trace"]) >= 4
          PY
      - name: Archive scores, frequency bins and reliability traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: microbatch-reliability-b${{ matrix.batch }}-seed${{ matrix.seed }}
          path: |
            microbatch_reliability.log
            research-lab/01-rare-words-shared-output-vectors/microbatch_reliability_b*_s*.jsonl
          if-no-files-found: ignore
