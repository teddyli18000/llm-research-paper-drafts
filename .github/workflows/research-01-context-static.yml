name: Research 01 — same-data static context-based semantic grouping
on:
  workflow_dispatch:
  push:
    paths:
      - "research-lab/01-rare-words-shared-output-vectors/context_groups.py"
      - "research-lab/01-rare-words-shared-output-vectors/context_static_study.py"
      - ".github/workflows/research-01-context-static.yml"
permissions:
  contents: read
jobs:
  context:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install scientific CPU dependencies
        run: |
          python -m pip install numpy huggingface_hub scipy scikit-learn
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Prepare public FineWeb dataset
        run: python research-lab/01-rare-words-shared-output-vectors/prepare_data.py
      - name: Build static distributional clusters from exactly the same training tokens
        run: python research-lab/01-rare-words-shared-output-vectors/context_groups.py
      - name: Build instrumented original LM
        run: python research-lab/01-rare-words-shared-output-vectors/build_runner.py
      - name: Train with fixed context groups, 3 matched model seeds
        run: |
          set -euo pipefail
          python -u research-lab/01-rare-words-shared-output-vectors/context_static_study.py | tee context_static.log
      - name: Archive matched control
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rare-01-same-data-context-groups
          path: |
            context_static.log
            research-lab/01-rare-words-shared-output-vectors/context_static_study.jsonl
          if-no-files-found: ignore
