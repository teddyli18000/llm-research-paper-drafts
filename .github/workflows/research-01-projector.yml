name: Research 01 — normalized projector gradient sharing
on:
  workflow_dispatch:
  push:
    paths:
      - "research-lab/01-rare-words-shared-output-vectors/projector_gradient_study.py"
      - ".github/workflows/research-01-projector.yml"
permissions:
  contents: read
jobs:
  projector:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU dependencies
        run: |
          python -m pip install numpy huggingface_hub
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Prepare dataset and controlled research-only code
        run: |
          python research-lab/01-rare-words-shared-output-vectors/prepare_data.py
          python research-lab/01-rare-words-shared-output-vectors/build_runner.py
      - name: Train 5 projector strengths at 3 seeds
        run: |
          set -euo pipefail
          python -u research-lab/01-rare-words-shared-output-vectors/projector_gradient_study.py | tee projector.log
      - name: Export all measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: research01-projector
          path: |
            projector.log
            research-lab/01-rare-words-shared-output-vectors/projector_gradient.jsonl
          if-no-files-found: ignore
