name: Research 01 — fair tuned Ember V16k standalone challenge
on:
  push:
    paths:
      - ".github/workflows/research-01-ember-v16k-tuning.yml"
      - "research-lab/01-rare-words-shared-output-vectors/ember_v16k_lr_challenge.py"
      - "research-review/01-rare-words-shared-output-vectors/EMBER_HEAD_LR_TUNING_CHALLENGE_V16K.md"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tuned_ember:
    runs-on: ubuntu-24.04
    timeout-minutes: 115
    strategy:
      fail-fast: false
      matrix:
        seed: [331, 337, 347]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU dependencies and pinned Ember
        run: |
          python -m pip install numpy huggingface_hub
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install "git+https://github.com/katop1234/ember.git@76f30117b2d948874cd1c965c4f6813fa9de8caa"
      - name: Prepare public FineWeb and original LM study runtime
        run: |
          python research-lab/01-rare-words-shared-output-vectors/prepare_data.py
          python research-lab/01-rare-words-shared-output-vectors/build_runner.py
      - name: Run all 13 pre-registered optimizer configurations
        run: |
          python -u research-lab/01-rare-words-shared-output-vectors/ember_v16k_lr_challenge.py --seed ${{ matrix.seed }} | tee ember_tuning.log
      - name: Check complete finite outcomes
        run: |
          python - <<'PY'
          import json,math
          from pathlib import Path
          files=list(Path("research-lab/01-rare-words-shared-output-vectors").glob("ember_v16k_tune_seed*.jsonl"))
          assert len(files)==1
          rows=[json.loads(s) for s in files[0].read_text().splitlines()]
          assert len(rows)==13 and len(set(r["tag"] for r in rows))==13
          assert all(math.isfinite(r["scores"]["val"]) for r in rows)
          PY
      - name: Archive complete sweep and frequency metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ember-v16k-tune-seed${{ matrix.seed }}
          path: |
            ember_tuning.log
            research-lab/01-rare-words-shared-output-vectors/ember_v16k_tune_seed*.jsonl
          if-no-files-found: ignore
