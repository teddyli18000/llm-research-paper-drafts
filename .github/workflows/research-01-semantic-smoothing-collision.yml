name: Research 01 — class projection versus semantic label smoothing
on:
  push:
    paths:
      - ".github/workflows/research-01-semantic-smoothing-collision.yml"
      - "research-lab/01-rare-words-shared-output-vectors/semantic_smoothing_collision.py"
      - "research-lab/01-rare-words-shared-output-vectors/semantic_smoothing_identity_test.py"
      - "research-review/01-rare-words-shared-output-vectors/SEMANTIC_SMOOTHING_COLLISION_PROTOCOL.md"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  semantic_smoothing:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix:
        seed: [353, 359, 367]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU scientific dependencies and pinned official Ember
        run: |
          python -m pip install numpy huggingface_hub scipy scikit-learn
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install "git+https://github.com/katop1234/ember.git@76f30117b2d948874cd1c965c4f6813fa9de8caa"
      - name: Check analytic gradient identities
        run: |
          python research-lab/01-rare-words-shared-output-vectors/semantic_smoothing_identity_test.py
      - name: Prepare train-only fixed contextual token classes
        run: |
          python research-lab/01-rare-words-shared-output-vectors/prepare_data.py
          python research-lab/01-rare-words-shared-output-vectors/context_groups.py
          python research-lab/01-rare-words-shared-output-vectors/build_runner.py
      - name: All twelve matched training arms, no post-hoc omissions
        run: |
          python -u research-lab/01-rare-words-shared-output-vectors/semantic_smoothing_collision.py --seed ${{ matrix.seed }} | tee semantic_smoothing.log
      - name: Verify 12 complete finite outcomes
        run: |
          python - <<'PY'
          import json, math
          from pathlib import Path
          ps=list(Path("research-lab/01-rare-words-shared-output-vectors").glob("semantic_smoothing_seed*.jsonl"))
          assert len(ps)==1
          rows=[json.loads(x) for x in ps[0].read_text().splitlines()]
          assert len(rows)==12 and len({r["tag"] for r in rows})==12
          assert all(math.isfinite(r["scores"]["val"]) for r in rows)
          PY
      - name: Archive per-method scores, frequency bins and runtimes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semantic-smoothing-v6k-seed${{ matrix.seed }}
          path: |
            semantic_smoothing.log
            research-lab/01-rare-words-shared-output-vectors/semantic_smoothing_seed*.jsonl
          if-no-files-found: ignore
