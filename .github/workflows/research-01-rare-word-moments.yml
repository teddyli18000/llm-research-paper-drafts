name: Research 01 — dynamic cluster Adam moments
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Pilot (200 steps, seed0) or confirm (400 steps, seeds0-2)"
        type: choice
        required: true
        options: [pilot, confirm]
        default: pilot
permissions:
  contents: read
jobs:
  study:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU research dependencies
        run: |
          python -m pip install numpy huggingface_hub
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Verify the mathematical mechanism
        run: python research-lab/01-rare-words-shared-output-vectors/theory_check.py
      - name: Prepare public FineWeb10B GPT-2 shards and token frequencies
        run: python research-lab/01-rare-words-shared-output-vectors/prepare_data.py
      - name: Build isolated instrumented experiment
        run: python research-lab/01-rare-words-shared-output-vectors/build_runner.py
      - name: Compare cluster + Adam state interventions
        run: |
          python -u research-lab/01-rare-words-shared-output-vectors/run_matrix.py --mode ${{ github.event.inputs.mode || 'pilot' }}
      - name: Export logs and experiment records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rare-01-matched-study-results
          path: |
            research-lab/01-rare-words-shared-output-vectors/results_*.jsonl
            research-lab/01-rare-words-shared-output-vectors/grid_study_runtime.py
          if-no-files-found: ignore
