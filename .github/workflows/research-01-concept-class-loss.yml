name: Research 01 — concept-class CE versus normalized gradient projection
on:
  push:
    paths:
      - ".github/workflows/research-01-concept-class-loss.yml"
      - "research-lab/01-rare-words-shared-output-vectors/concept_class_collision.py"
      - "research-review/01-rare-words-shared-output-vectors/CONCEPT_CLASS_LOSS_COLLISION_PROTOCOL.md"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  concept_class_comparison:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    strategy:
      fail-fast: false
      matrix:
        seed: [397,409,419]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU, train-context clustering and official Ember
        run: |
          python -m pip install numpy huggingface_hub scipy scikit-learn
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install "git+https://github.com/katop1234/ember.git@76f30117b2d948874cd1c965c4f6813fa9de8caa"
      - name: Prepare unchanged original LM and train-only classes
        run: |
          python research-lab/01-rare-words-shared-output-vectors/prepare_data.py
          python research-lab/01-rare-words-shared-output-vectors/context_groups.py
          python research-lab/01-rare-words-shared-output-vectors/build_runner.py
      - name: Train all seven fixed semantic class-objective controls
        run: |
          python -u research-lab/01-rare-words-shared-output-vectors/concept_class_collision.py --seed ${{ matrix.seed }} | tee concept.log
      - name: Verify all controls and finite hard CE
        run: |
          python - <<'PY'
          import json,math
          from pathlib import Path
          ps=list(Path("research-lab/01-rare-words-shared-output-vectors").glob("concept_class_seed*.jsonl"))
          assert len(ps)==1
          rows=[json.loads(x) for x in ps[0].read_text().splitlines()]
          assert len(rows)==7 and len({r["tag"] for r in rows})==7
          assert all(math.isfinite(r["scores"]["val"]) for r in rows)
          PY
      - name: Archive all hard-token CE and train frequency bins
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: concept-class-comparison-seed${{ matrix.seed }}
          path: |
            concept.log
            research-lab/01-rare-words-shared-output-vectors/concept_class_seed*.jsonl
          if-no-files-found: ignore
