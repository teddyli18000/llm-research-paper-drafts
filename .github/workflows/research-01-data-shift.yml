name: Research 01 — train-slice robustness
on:
  workflow_dispatch:
  push:
    paths:
      - "research-lab/01-rare-words-shared-output-vectors/data_shift_study.py"
      - ".github/workflows/research-01-data-shift.yml"
permissions:
  contents: read
jobs:
  datashift:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU dependencies
        run: |
          python -m pip install numpy huggingface_hub
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Prepare public dataset and controlled source copy
        run: |
          python research-lab/01-rare-words-shared-output-vectors/prepare_data.py
          python research-lab/01-rare-words-shared-output-vectors/build_runner.py
      - name: Run model-init seeds 0 1 across four independent data slices
        run: |
          set -euo pipefail
          python -u research-lab/01-rare-words-shared-output-vectors/data_shift_study.py | tee data_shift.log
      - name: Archive 16 independently executed results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: research01-data-shift
          path: |
            data_shift.log
            research-lab/01-rare-words-shared-output-vectors/data_shift.jsonl
          if-no-files-found: ignore
